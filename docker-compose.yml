services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medsignal}
      POSTGRES_DB: ${POSTGRES_DB:-medsignal}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medsignal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
