[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medsignal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=0.2.0,<0.3.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langsmith>=0.1.0",

    # LLM / embeddings
    "groq>=0.9.0",
    "sentence-transformers>=3.0.0",   # BGE-M3 via sentence-transformers
    "transformers>=4.40.0",
    "torch>=2.2.0",

    # MCP
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",

    # Database
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",

    # BM25
    "rank-bm25==0.2.2",

    # Eval
    "ragas>=0.1.0",

    # API
    "fastapi==0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",

    # UI
    "streamlit==1.35.0",

    # Data ingestion
    "httpx>=0.27.0",
    "biopython>=1.83",

    # Experiment tracking
    "mlflow>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
